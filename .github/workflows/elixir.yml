# separate terms of service, privacy policy, and support
# documentation.

name: Elixir CI

on:
  push:
    branches: [develop, "main", stage]
  pull_request:
    branches: [develop, "main", stage]

permissions:
  contents: read

jobs:
  build:

    name: Build and test
    runs-on: ubuntu-22.04
    env:
      GENAI_CORE_PATH: ${{ github.workspace }}/.ci/genai-core

    steps:
    - uses: actions/checkout@v4
    # Use immutable co-developed contracts until the Core Hex release exists.
    - name: Check out classifier Core contracts
      uses: actions/checkout@v4
      with:
        repository: noizu-labs-ml/genai-core
        ref: a98208599ab003f6ef1cc8ffdb01e91d01d5331b
        path: .ci/genai-core
    - name: Set up Elixir
      uses: erlef/setup-beam@61e01a43a562a89bfc54c7f9a378ff67b03e4a21 # v1.16.0
      with:
        elixir-version: '1.17.3' # [Required] Define the Elixir version
        otp-version: '27.2'      # [Required] Define the Erlang/OTP version
    - name: Restore dependencies cache
      uses: actions/cache@v3
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Run slim develop acceptance
      if: github.base_ref == 'develop' || github.ref_name == 'develop'
      run: >-
        mix test test/genai_providers/classifier_providers_test.exs
        test/genai_providers/qwen_native_test.exs test/providers/qwen_test.exs
        --exclude live --exclude advanced
    - name: Run release-branch tests
      if: github.base_ref != 'develop' && github.ref_name != 'develop'
      run: mix test
